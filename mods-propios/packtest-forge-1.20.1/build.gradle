plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

// Mod de pruebas propio (solo cliente). No hace nada sin -Dpacktest.script=<ruta>.
version = '1.0.0'
group = 'dev.grec.packtest'
base { archivesName = 'packtest' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'packtest.script', "${projectDir}/scripts/autoprueba.txt"
            mods { packtest { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
}

tasks.named('jar') { finalizedBy 'reobfJar' }

tasks.withType(Jar).configureEach {
    manifest {
        attributes([
            'Specification-Title'   : 'packtest',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version
        ])
    }
}
