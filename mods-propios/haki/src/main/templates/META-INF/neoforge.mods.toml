modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Player Animation Library: opcional. Con ella la pose de lanzamiento se reproduce como animacion PAL (capa haki:cast);
# sin ella se usa el Mixin de respaldo en PlayerModel.setupAnim.
[[dependencies.${mod_id}]]
    modId="player_animation_library"
    type="optional"
    versionRange="[1.1.6,)"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
config="haki.mixins.json"
