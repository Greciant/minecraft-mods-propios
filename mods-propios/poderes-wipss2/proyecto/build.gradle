plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    maven { url 'https://maven.theillusivec4.top/' }
    maven { url 'https://maven.neoforged.net/releases' }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url 'https://maven.kosmx.dev/' }
}

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Prueba automatica con capturas (solo desarrollo, no entra en el jar)
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        // Prueba: aplica todos los mixins (fuerza cargar cada clase destino), revisa datos y cierra el server.
        audit {
            server()
            programArgument '--nogui'
            systemProperty 'wips.audit', 'true'
            gameDirectory = file('run')
        }
        fx {
            client()
            systemProperty 'wips.autotest', 'true'
            sourceSet = sourceSets.devtest
            gameDirectory = file('run-fx')
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtest)
        }
    }
}

dependencies {
    runtimeOnly files('../_jars/awakened-1.23.1+1.21.1.jar')
    runtimeOnly files('../_jars/grandline-1.21.1-0.3.0.jar')
    runtimeOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api'
    // Los dos mods que parcheamos: solo para compilar, no se redistribuyen.
    compileOnly files('../_jars/awakened-1.23.1+1.21.1.jar')
    compileOnly files('../_jars/grandline-1.21.1-0.3.0.jar')
    compileOnly files('../_jars/impactframe-1.1.0-neoforge.jar')
    compileOnly files('../_jars/weaponleveling-1.21.1-neoforge-3.2.0-beta.1.jar')
    compileOnly files('../_jars/irons_spellbooks-1.21.1-3.16.3.jar')
    compileOnly files('../_jars/zoltraak_cinematic-neoforge-1.21.1-1.0.4.jar')
    compileOnly files('../_jars/hyper_n_hieis_shenanigans-neoforge-1.21.1-1.0.1.jar')
    compileOnly files('../_jars/punchy-3.0-neoforge-1.21.1-birthday.jar')
    compileOnly files('../_jars/touch_n_motion_neoforge_1.21.1_1.0.4.jar')
    // Solo para probar: gradle runAudit -PauditMods (Iron's Spells, Hyper 'N Hiei, Zoltraak y sus dependencias)
    if (project.hasProperty('auditMods')) {
        runtimeOnly fileTree(dir: '../_jars/runtime', include: '*.jar')
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
