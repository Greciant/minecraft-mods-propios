[exosavant]
	#Show the Exosavant visor status cluster.
	hudStatusCluster = true
	#Show the Exosavant visor target panel while a foe is locked.
	hudTargetDossier = true
	#Show the Exosavant visor flight instruments, horizon and speed streaks while flying.
	hudFlightInstruments = true
	#Screen corner for the Exosavant status cluster.
	#Allowed Values: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT
	hudStatusClusterCorner = "TOP_LEFT"
	#Screen corner for the Exosavant target panel.
	#Allowed Values: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT
	hudTargetDossierCorner = "BOTTOM_RIGHT"
	#Screen corner for the Exosavant flight instruments.
	#Allowed Values: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT
	hudFlightInstrumentsCorner = "TOP_RIGHT"
	#Internal: times the Exosavant flight tip has been shown. Set to 0 to see it again.
	# Default: 0
	# Range: 0 ~ 99
	flightHintsShown = 0

[aero]
	#Internal: whether the Aerokinetic flight tip has been shown. Set to false to see it again.
	flightHintShown = false

[velocity]
	#Internal: times the Velocity gear tip has been shown. Set to 0 to see it again.
	# Default: 0
	# Range: 0 ~ 99
	gearHintsShown = 0

[pyrokinetic]
	#Internal: whether the Pyrokinetic overdrive tip has been shown. Set to false to see it again.
	overdriveHintShown = true
	#Internal: whether the Pyrokinetic blue fire tip has been shown. Set to false to see it again.
	blueHintShown = true

[command]
	#Internal: whether the Command first-rule tip has been shown. Set to false to see it again.
	rulesHintShown = true

[contest]
	#Show the Mod of the Year nomination reminder (ends November 9, 2026).
	nominationReminder = true
