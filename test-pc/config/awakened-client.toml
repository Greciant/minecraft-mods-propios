[input]
	#Slot keys activate the ability as well as select it.
	quickKeyMode = false
	#Hold Activate to open the ability wheel and release to fire the chosen slot.
	abilityWheel = false

[fx]
	#Camera shake from boss impacts and big ability hits.
	screenShake = true
	#Camera shake strength. 0 = off, 1 = default, 2 = double.
	# Default: 1.0
	# Range: 0.0 ~ 2.0
	screenShakeIntensity = 1.0
	#How the Infinite Void intro plays when one catches you: FULL, SHORT or NO_CAMERA (your own view).
	#Allowed Values: FULL, SHORT, NO_CAMERA
	voidIntro = "FULL"
	#Play the spinner animation on a Catalyst roll. Off = instant reveal.
	catalystSpinner = true
	#Play note-block boss themes. Off = vanilla music.
	bossNoteMusic = true
	#Play the Brawler combo sounds only you hear.
	brawlerComboSounds = true
	#Show the Spider-Sense screen ripple and sound when a threat targets you.
	spiderSense = true
	#Show your own Reaper aura in first person. Affects only your view.
	reaperAuraSelfFirstPerson = true
	#Show your own Reaper aura in third person. Affects only your view.
	reaperAuraSelfThirdPerson = true

[hud]
	#Show only the slot number above the ability tray, not the ability name.
	abilityNumberOnly = false
	#Hide the stamina bar while it is full.
	hideStaminaWhenFull = false
	#Hide the ability tray and show only the current ability's icon beside the hotbar.
	iconsOff = false
	#In the HUD layout editor, moving one part of a multi-part element moves the rest too.
	moveTogether = true
	#Show the stamina bar (with a power's resource bar under it) on your HUD.
	powerHud = true
	#Whether you have moved the stamina bar (with a power's resource bar under it). False = default spot; the settings below are ignored.
	powerHudPlaced = false
	#Which point of the stamina bar (with a power's resource bar under it)'s box the position refers to.
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, MIDDLE_LEFT, MIDDLE_CENTER, MIDDLE_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
	powerHudAnchor = "TOP_LEFT"
	#Horizontal position of the stamina bar (with a power's resource bar under it), as a fraction of screen width (0 = left, 1 = right).
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	powerHudX = 0.0
	#Vertical position of the stamina bar (with a power's resource bar under it), as a fraction of screen height (0 = top, 1 = bottom).
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	powerHudY = 0.0
	#Show the ability tray and the ability's name above it on your HUD.
	abilityHud = true
	#Whether you have moved the ability tray and the ability's name above it. False = default spot; the settings below are ignored.
	abilityHudPlaced = false
	#Which point of the ability tray and the ability's name above it's box the position refers to.
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, MIDDLE_LEFT, MIDDLE_CENTER, MIDDLE_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
	abilityHudAnchor = "TOP_LEFT"
	#Horizontal position of the ability tray and the ability's name above it, as a fraction of screen width (0 = left, 1 = right).
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	abilityHudX = 0.0
	#Vertical position of the ability tray and the ability's name above it, as a fraction of screen height (0 = top, 1 = bottom).
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	abilityHudY = 0.0
	#Show the selected ability's icon beside the hotbar (shown while the ability tray is off) on your HUD.
	abilityIcon = true
	#Whether you have moved the selected ability's icon beside the hotbar (shown while the ability tray is off). False = default spot; the settings below are ignored.
	abilityIconPlaced = false
	#Which point of the selected ability's icon beside the hotbar (shown while the ability tray is off)'s box the position refers to.
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, MIDDLE_LEFT, MIDDLE_CENTER, MIDDLE_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
	abilityIconAnchor = "TOP_LEFT"
	#Horizontal position of the selected ability's icon beside the hotbar (shown while the ability tray is off), as a fraction of screen width (0 = left, 1 = right).
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	abilityIconX = 0.0
	#Vertical position of the selected ability's icon beside the hotbar (shown while the ability tray is off), as a fraction of screen height (0 = top, 1 = bottom).
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	abilityIconY = 0.0
	#Show the tall power gauge on the right edge on your HUD.
	resourceGauge = true
	#Whether you have moved the tall power gauge on the right edge. False = default spot; the settings below are ignored.
	resourceGaugePlaced = false
	#Which point of the tall power gauge on the right edge's box the position refers to.
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, MIDDLE_LEFT, MIDDLE_CENTER, MIDDLE_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
