#Availability.
[fruit]
	#Whether a casket can roll this fruit and it can be eaten. Existing users keep their power.
	enabled = true
	#Rarity when a Devil Fruit Casket opens: LEGENDARY, RARE, UNCOMMON or COMMON (tier weights: devilfruits-common.toml [gacha]).
	#Allowed Values: LEGENDARY, RARE, UNCOMMON, COMMON
	gachaTier = "UNCOMMON"
	#Relative weight among the fruits of the same gacha tier when a casket opens (0 = never in a casket).
	# Default: 10
	# Range: 0 ~ 10000
	lootWeight = 10
	#Balance updates this file has received (the mod raises it itself when it resets values whose defaults
	#changed; lower it to take an update's new defaults again).
	# Default: 0
	# Range: 0 ~ 10000
	configRevision = 1

#Energy.
[energy]
	#Maximum energy at mastery 1.
	# Default: 200
	# Range: 10 ~ 10000
	baseEnergy = 200
	#Additional maximum energy per mastery level above 1.
	# Default: 20
	# Range: 0 ~ 1000
	energyPerLevel = 20
	#Energy regenerated per second while in combat.
	# Default: 2.5
	# Range: 0.0 ~ 1000.0
	regenInCombat = 2.5
	#Energy regenerated per second out of combat.
	# Default: 7.0
	# Range: 0.0 ~ 1000.0
	regenOutOfCombat = 7.0
	#Multiplier for this fruit's mastery XP (on top of the global one).
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	xpMultiplier = 1.0

#Fruit-wide settings.
[settings]
	#How much more terrain the techniques tear up at mastery 10 than at mastery 1 (rising evenly in between).
	# Default: 3.5
	# Range: 1.0 ~ 10.0
	destructionAtMaxMastery = 3.5

#Per-ability balance.
[abilities]

	[abilities.kaishin]
		#Whether this ability can be used at all.
		enabled = true
		#Energy consumed per cast.
		# Default: 14
		# Range: 0 ~ 1000
		energyCost = 14
		#Cooldown in ticks (20 ticks = 1 second) before mastery reduction.
		# Default: 22
		# Range: 0 ~ 72000
		cooldownTicks = 22
		#Mastery level (1-10) required to unlock this ability.
		# Default: 1
		# Range: 1 ~ 10
		requiredMastery = 1
		#Base damage (half-hearts) before mastery scaling.
		# Default: 11.0
		# Range: 0.0 ~ 1000.0
		damage = 11.0
		#Base radius / reach in blocks before mastery scaling.
		# Default: 7.0
		# Range: 0.5 ~ 128.0
		range = 7.0
		#Knockback strength.
		# Default: 1.5
		# Range: 0.0 ~ 20.0
		knockback = 1.5
		#Ticks to reach a full charge.
		# Default: 36.0
		# Range: 5.0 ~ 200.0
