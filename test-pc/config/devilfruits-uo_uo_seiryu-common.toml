#Availability.
[fruit]
	#Whether a casket can roll this fruit and it can be eaten. Existing users keep their power.
	enabled = true
	#Rarity when a Devil Fruit Casket opens: LEGENDARY, RARE, UNCOMMON or COMMON (tier weights: devilfruits-common.toml [gacha]).
	#Allowed Values: LEGENDARY, RARE, UNCOMMON, COMMON
	gachaTier = "LEGENDARY"
	#Relative weight among the fruits of the same gacha tier when a casket opens (0 = never in a casket).
	# Default: 4
	# Range: 0 ~ 10000
	lootWeight = 4
	#Balance updates this file has received (the mod raises it itself when it resets values whose defaults
	#changed; lower it to take an update's new defaults again).
	# Default: 0
	# Range: 0 ~ 10000
	configRevision = 0

#Energy.
[energy]
	#Maximum energy at mastery 1.
	# Default: 150
	# Range: 10 ~ 10000
	baseEnergy = 150
	#Additional maximum energy per mastery level above 1.
	# Default: 15
	# Range: 0 ~ 1000
	energyPerLevel = 15
	#Energy regenerated per second while in combat.
	# Default: 3.0
	# Range: 0.0 ~ 1000.0
	regenInCombat = 3.0
	#Energy regenerated per second out of combat.
	# Default: 8.0
	# Range: 0.0 ~ 1000.0
	regenOutOfCombat = 8.0
	#Multiplier for this fruit's mastery XP (on top of the global one).
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	xpMultiplier = 1.0

#Fruit-wide settings.
[settings]
	#Bonus damage of melee blows (doubled in Hybrid form): lightning and flame crackle on hit.
	# Default: 2.0
	# Range: 0.0 ~ 50.0
	meleeAuraDamage = 2.0
	#Chance that a melee blow sets the target on fire.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	meleeIgniteChance = 0.25
	#Hybrid moveset: damage of a weight-1 hit at mastery 1 (each technique's 'damage' is its weight, e.g. 0.25 per Hellfire Ray hit).
	# Default: 6.0
	# Range: 0.0 ~ 100.0
	hybridBaseHit = 6.0
	#Hybrid form: fraction of incoming damage ignored (on top of its armor).
	# Default: 0.15
	# Range: 0.0 ~ 0.9
	hybridDamageReduction = 0.15
	#The Hybrid form shrinks to fit doors and tunnels and grows back outside.
	hybridAdaptiveSize = true
	#Length of the Azure Dragon's body in blocks (head to tail tip).
	# Default: 140.0
	# Range: 12.0 ~ 300.0
	dragonBodyLength = 140.0
	#Number of hitboxes along the dragon's body (attacks can hit the body); about one per 3.3 blocks of body leaves no gaps.
	# Default: 42.0
	# Range: 4.0 ~ 64.0
	dragonHitboxParts = 42.0
	#Cruising flight speed of the dragon in blocks per tick.
	# Default: 2.7
	# Range: 0.2 ~ 6.0
	dragonFlightSpeed = 2.7
	#Flight speed while boosting in blocks per tick.
	# Default: 5.1
	# Range: 0.2 ~ 8.0
	dragonBoostSpeed = 5.1
	#Slithering speed on the ground in blocks per tick.
	# Default: 0.42
	# Range: 0.1 ~ 2.0
	dragonGroundSpeed = 0.42

#Forms.
[forms]

	[forms.human]
		#Factor on energy regeneration while in this form.
		# Default: 1.0
		# Range: 0.0 ~ 10.0
		regenMultiplier = 1.0
		#Cooldown in ticks after returning to the base form before transforming again.
		# Default: 0
		# Range: 0 ~ 72000
		switchCooldownTicks = 0

	[forms.hybrid]
		#Factor on energy regeneration while in this form.
		# Default: 0.35
		# Range: 0.0 ~ 10.0
		regenMultiplier = 0.35
		#Mastery level (1-10) required to enter this form.
		# Default: 3
		# Range: 1 ~ 10
		requiredMastery = 3
		#Energy paid to enter this form.
		# Default: 20
		# Range: 0 ~ 10000
		enterEnergyCost = 20
		#Energy drained per second while in this form.
		# Default: 0.0
		# Range: 0.0 ~ 1000.0
		energyDrainPerSecond = 0.0
		#Cooldown in ticks after entering this form before the next voluntary switch.
		# Default: 60
		# Range: 0 ~ 72000
		switchCooldownTicks = 60
		#Wind-up in ticks before a voluntary switch into this form completes (0 = instant).
		# Default: 30
		# Range: 0 ~ 600
		castTicks = 30
		#Seconds a full energy bar lasts in this form: it then drains max energy / this each second, whatever the mastery, instead of energyDrainPerSecond and boostDrainPerSecond (0 = those drains).
		# Default: 0
		# Range: 0 ~ 3600
		timeLimitSeconds = 0
		#Techniques cost no energy in this form (the form itself spends it).
		freeAbilities = false

		#Attribute modifiers of the form (amounts; the operation is fixed by the fruit).
		[forms.hybrid.attributes]
			# Default: 1.0
			# Range: -1000.0 ~ 1000.0
			generic_scale = 1.0
			# Default: 20.0
			# Range: -1000.0 ~ 1000.0
			generic_max_health = 20.0
			# Default: 4.0
			# Range: -1000.0 ~ 1000.0
			generic_attack_damage = 4.0
			# Default: 6.0
			# Range: -1000.0 ~ 1000.0
			generic_armor = 6.0
			# Default: 3.0
			# Range: -1000.0 ~ 1000.0
			generic_armor_toughness = 3.0
			# Default: 0.4
			# Range: -1000.0 ~ 1000.0
			generic_knockback_resistance = 0.4
			# Default: 0.6
			# Range: -1000.0 ~ 1000.0
			generic_step_height = 0.6
			# Default: 1.5
			# Range: -1000.0 ~ 1000.0
			player_entity_interaction_range = 1.5
			# Default: 1.0
			# Range: -1000.0 ~ 1000.0
			player_block_interaction_range = 1.0
			# Default: -1.0
			# Range: -1000.0 ~ 1000.0
			generic_fall_damage_multiplier = -1.0

